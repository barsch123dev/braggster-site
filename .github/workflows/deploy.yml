name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site
        run: python3 tools/build.py

      - name: Contrast gate (WCAG AA)
        run: python3 tools/check_contrast.py

      - name: Copy gate (no em dashes, locale parity)
        run: python3 tools/check_copy.py

      # Universal links (Live Table invites) need dist/.well-known/ to reach the
      # live site. Pages drops it unless .nojekyll is present, so fail here,
      # on pull requests too, if either file is missing or the manifest is not
      # JSON.
      - name: Well-known files gate (universal links)
        run: |
          test -f dist/.nojekyll
          python3 -c "import json; json.load(open('dist/.well-known/apple-app-site-association'))"
          python3 -c "import json; json.load(open('dist/.well-known/assetlinks.json'))"

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      # Keep this on v3. v4 and later add --exclude=".[^/]*" to the archive
      # step, which silently drops every hidden path, including .well-known/
      # and .nojekyll, and breaks the app's universal links.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Only main deploys. Pull requests run the gates above and stop there.
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
